<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24">
  <!-- The launch's mark: the app icon's waves (public/icon.svg, atoms/Icon/icons/wave.tsx) in
       terracotta, 128pt square. The launch screen (Info.plist UILaunchScreen) centres it on the
       paper, and the app's launch cover (LaunchCover.swift) draws this same image in the same
       place before it hands off to the first screen. Not kept as a vector: the build draws it
       at each scale, plain bitmaps whatever draws the launch screen. -->
  <g fill="none" stroke="#c96736" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4,8.2 C5.4,5.9 7.3,5.8 9.2,8.0 C11.1,10.2 13.0,10.3 15.0,8.1 C16.9,6.0 18.8,5.9 20.7,8.1"/>
    <path d="M3.0,12.1 C5.1,9.7 7.1,9.8 9.0,12.0 C10.9,14.2 12.9,14.3 14.9,12.1 C16.8,9.9 18.8,9.8 20.9,12.0"/>
    <path d="M3.5,16.0 C5.4,13.8 7.4,13.7 9.3,15.9 C11.2,18.1 13.1,18.2 15.1,16.0 C17.0,13.9 18.9,13.8 20.8,16.0"/>
  </g>
</svg>
