# XcodeGen spec for the iOS spike app (S1–S6). Generate with:
#   cd native/ios && xcodegen generate
name: ResonanceSpikes
options:
  bundleIdPrefix: com.resonance
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ResonanceGeometry:
    path: ../geometry/swift
  # S6: the v1 client is generated at build time from openapi/v1/openapi.json.
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.13.1
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.12.1
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.3.1
targets:
  ResonanceSpikes:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../fonts
        type: folder
        buildPhase: resources
        name: Fonts
      - path: ../fixtures/grain
        buildPhase: resources
      - path: ../fixtures/geometry.json
        buildPhase: resources
      # S4: the editor island (scripts/native/build-editor.mjs) and the round-trip corpus.
      - path: ../editor/dist/editor.html
        buildPhase: resources
      - path: ../fixtures/markdown-corpus.json
        buildPhase: resources
    dependencies:
      - package: ResonanceGeometry
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resonance.spikes
        PRODUCT_NAME: ResonanceSpikes
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDisplayName: 共振 Spikes
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
