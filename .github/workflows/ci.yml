name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The native apps' generated tokens, string accessors and icons must match the web.
      - run: npx tsx scripts/native/tokens.ts && npx tsx scripts/apps/l10n.ts && npx tsx scripts/apps/icons.ts
      - run: git diff --exit-code -- apps native

  # Firestore rules + Admin SDK purge suites against the local emulators.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools@15
      - run: npm run test:emulator
